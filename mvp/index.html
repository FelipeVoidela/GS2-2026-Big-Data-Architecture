<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boca de Lobo · Onde não passar hoje</title>
<meta name="description" content="Mapa público de bocas de lobo entupidas em áreas de risco de alagamento, com a chuva prevista para as próximas 24 horas, e a lista de limpeza priorizada pelo bot de RPA.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --texto: #1a1f2b; --suave: #5a6375; --borda: #dde1e8;
    --evite: #b42318; --evite-bg: #fee4e2; --atencao: #8a5a00; --atencao-ponto: #e8a317; --atencao-bg: #fff4d6;
    --normal: #1e6b3a; --normal-ponto: #2f9e5b; --normal-bg: #e3f4ea; --foco: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--texto); }
  header { background: #0f2a4a; color: #fff; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
  header h1 { margin: 0; font-size: 1.35rem; }
  header p { margin: 0; color: #c9d6ea; font-size: .95rem; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 0; height: calc(100vh - 56px); }
  aside { overflow-y: auto; padding: 16px; border-right: 1px solid var(--borda); background: var(--card); }
  #mapa { height: 100%; }
  .resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .chip { border-radius: 10px; padding: 10px; text-align: center; }
  .chip b { display: block; font-size: 1.6rem; line-height: 1.1; }
  .chip span { font-size: .8rem; font-weight: 600; }
  .chip.evite { background: var(--evite-bg); color: var(--evite); }
  .chip.atencao { background: var(--atencao-bg); color: var(--atencao); }
  .chip.normal { background: var(--normal-bg); color: var(--normal); }
  .chuva { background: #eaf1fb; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: .92rem; }
  label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: 4px; }
  input[type=search] { width: 100%; padding: 10px 12px; font-size: 1rem; border: 1px solid var(--borda); border-radius: 8px; }
  input:focus-visible, button:focus-visible, li:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
  .filtros { display: flex; gap: 6px; margin: 10px 0 12px; flex-wrap: wrap; }
  .filtros button { border: 1px solid var(--borda); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .85rem; }
  .filtros button[aria-pressed=true] { background: #0f2a4a; color: #fff; border-color: #0f2a4a; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border: 1px solid var(--borda); border-left-width: 6px; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; background: #fff; }
  li.EVITE { border-left-color: var(--evite); } li.ATENCAO { border-left-color: var(--atencao-ponto); } li.NORMAL { border-left-color: var(--normal-ponto); }
  li h3 { margin: 0 0 2px; font-size: .98rem; }
  li .meta { color: var(--suave); font-size: .82rem; }
  li .rec { font-size: .88rem; margin-top: 4px; }
  .selo { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
  .selo.EVITE { background: var(--evite-bg); color: var(--evite); } .selo.ATENCAO { background: var(--atencao-bg); color: var(--atencao); } .selo.NORMAL { background: var(--normal-bg); color: var(--normal); }
  footer { font-size: .78rem; color: var(--suave); margin-top: 12px; line-height: 1.45; }
  .legenda { background: #fff; padding: 8px 10px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.2); font-size: .82rem; line-height: 1.7; }
  .legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .abas { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #eef1f5; border-radius: 10px; padding: 4px; margin-bottom: 12px; }
  .abas button { border: 0; background: transparent; border-radius: 8px; padding: 8px 6px; font-size: .9rem; font-weight: 600; color: var(--suave); cursor: pointer; }
  .abas button[aria-selected=true] { background: #fff; color: var(--texto); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  [hidden] { display: none !important; }
  .execucao { border: 1px solid var(--borda); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: .9rem; line-height: 1.5; }
  .execucao .topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .execucao .suave { color: var(--suave); font-size: .82rem; }
  .nivel { font-weight: 700; font-size: .8rem; padding: 3px 10px; border-radius: 999px; }
  .nivel.ALERTA { background: var(--evite-bg); color: var(--evite); } .nivel.ATENCAO { background: var(--atencao-bg); color: var(--atencao); }
  .nivel.NORMAL { background: var(--normal-bg); color: var(--normal); } .nivel.SEM { background: #eef1f5; color: var(--suave); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { background: #f3f5f8; border-radius: 10px; padding: 8px; text-align: center; }
  .kpi b { display: block; font-size: 1.35rem; line-height: 1.15; }
  .kpi span { font-size: .74rem; color: var(--suave); font-weight: 600; }
  .inspecoes { font-size: .82rem; color: var(--suave); margin: -4px 0 12px; }
  li.CRITICA { border-left-color: #b42318; } li.ALTA { border-left-color: #ea580c; } li.MEDIA { border-left-color: #e8a317; }
  .selo.CRITICA { background: var(--evite-bg); color: var(--evite); } .selo.ALTA { background: #ffedd5; color: #9a3412; }
  .selo.MEDIA { background: var(--atencao-bg); color: var(--atencao); }
  .tag { display: inline-block; font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: #eef1f5; color: var(--suave); margin: 4px 4px 0 0; }
  .tag.reforco { background: #fde8e8; color: var(--evite); } .tag.reinsp { background: #e0ecff; color: #1d4ed8; }
  .aviso { background: #f3f5f8; border-radius: 10px; padding: 12px; font-size: .9rem; color: var(--suave); }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    #mapa { height: 55vh; order: -1; }
    aside { border-right: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Boca de Lobo</h1>
  <p>Onde não passar hoje: bueiros entupidos em áreas que alagam, com a chuva prevista para as próximas 24 horas.</p>
</header>
<main>
  <aside aria-label="Resumo e lista de pontos">
    <div class="abas" role="tablist" aria-label="Visões do mapa">
      <button role="tab" id="aba-cidadao" aria-controls="painel-cidadao" aria-selected="true">Onde não passar</button>
      <button role="tab" id="aba-rpa" aria-controls="painel-rpa" aria-selected="false" tabindex="-1">Limpeza (RPA)</button>
    </div>
    <section id="painel-cidadao" role="tabpanel" aria-labelledby="aba-cidadao">
    <div class="resumo" aria-live="polite">
      <div class="chip evite"><b id="n-evite">–</b><span>Evite a área</span></div>
      <div class="chip atencao"><b id="n-atencao">–</b><span>Atenção</span></div>
      <div class="chip normal"><b id="n-normal">–</b><span>Normal</span></div>
    </div>
    <div class="chuva" id="chuva">Carregando previsão…</div>
    <label for="busca">Procure sua rua, bairro ou subprefeitura</label>
    <input id="busca" type="search" placeholder="Ex.: Itaim Paulista, Rua Jordânia" autocomplete="off">
    <div class="filtros" role="group" aria-label="Filtrar por nível de alerta">
      <button data-f="TODOS" aria-pressed="true">Todos</button>
      <button data-f="EVITE A AREA" aria-pressed="false">Evite a área</button>
      <button data-f="ATENCAO" aria-pressed="false">Atenção</button>
      <button data-f="NORMAL" aria-pressed="false">Normal</button>
    </div>
    <ul id="lista" aria-label="Bocas de lobo"></ul>
    <footer id="rodape"></footer>
    </section>
    <section id="painel-rpa" role="tabpanel" aria-labelledby="aba-rpa" hidden>
      <div id="rpa-conteudo" aria-live="polite"><div class="aviso">Carregando a lista de limpeza…</div></div>
      <div class="filtros" id="rpa-filtros" role="group" aria-label="Filtrar por prioridade" hidden>
        <button data-p="TODAS" aria-pressed="true">Todas</button>
        <button data-p="CRITICA" aria-pressed="false">Crítica</button>
        <button data-p="ALTA" aria-pressed="false">Alta</button>
        <button data-p="MEDIA" aria-pressed="false">Média</button>
      </div>
      <ul id="rpa-lista" aria-label="Ordens de serviço de limpeza"></ul>
      <footer id="rpa-rodape"></footer>
    </section>
  </aside>
  <div id="mapa" role="region" aria-label="Mapa das bocas de lobo"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = "https://98-86-45-71.sslip.io/api/v1";
const COR = { "EVITE A AREA": "#b42318", "ATENCAO": "#e8a317", "NORMAL": "#2f9e5b" };
const ROTULO = { "EVITE A AREA": "Evite a área", "ATENCAO": "Atenção", "NORMAL": "Normal" };
const CLASSE = { "EVITE A AREA": "EVITE", "ATENCAO": "ATENCAO", "NORMAL": "NORMAL" };
const ORDEM = { "EVITE A AREA": 0, "ATENCAO": 1, "NORMAL": 2 };
const RISCO = { dentro: "dentro de área de risco", vizinho: "ao lado de área de risco", fora: "fora de área de risco mapeada" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const mapa = L.map("mapa", { zoomControl: true }).setView([-23.62, -46.6], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap"
}).addTo(mapa);
const camadaCidadao = L.layerGroup().addTo(mapa);
const camadaRpa = L.layerGroup();
const legenda = L.control({ position: "bottomright" });
legenda.onAdd = () => L.DomUtil.create("div", "legenda");
legenda.addTo(mapa);
function desenharLegenda(cores, rotulos, extra = "") {
  legenda.getContainer().innerHTML =
    Object.keys(cores).map(k => `<i style="background:${cores[k]}"></i>${rotulos[k]}`).join("<br>") + extra;
}
desenharLegenda(COR, ROTULO);

let pontos = [], marcadores = {}, filtro = "TODOS";

function popup(p) {
  return `<strong>${esc(p.logradouro)}</strong><br>${esc(p.distrito)} · ${esc(p.subprefeitura)}<br>
    <span class="selo ${CLASSE[p.nivel_alerta]}">${ROTULO[p.nivel_alerta]}</span>
    Obstrução ${p.obstrucao_pct ?? "–"}%<br>
    Chuva prevista (24 h): <b>${p.chuva_prevista_24h_mm ?? "–"} mm</b><br>
    ${RISCO[p.situacao_risco] || ""}${p.grau_risco ? " (" + esc(p.grau_risco) + ")" : ""}<br>
    <em>${esc(p.recomendacao)}</em>`;
}

function render() {
  const q = document.getElementById("busca").value.trim().toLowerCase();
  const vis = pontos.filter(p =>
    (filtro === "TODOS" || p.nivel_alerta === filtro) &&
    (!q || `${p.logradouro} ${p.distrito} ${p.subprefeitura}`.toLowerCase().includes(q)));
  const ids = new Set(vis.map(p => p.id_bueiro));
  for (const [id, m] of Object.entries(marcadores)) {
    if (ids.has(id)) { if (!camadaCidadao.hasLayer(m)) camadaCidadao.addLayer(m); } else camadaCidadao.removeLayer(m);
  }
  const ul = document.getElementById("lista");
  ul.innerHTML = vis.slice(0, 150).map(p => `
    <li class="${CLASSE[p.nivel_alerta]}" tabindex="0" data-id="${esc(p.id_bueiro)}">
      <h3><span class="selo ${CLASSE[p.nivel_alerta]}">${ROTULO[p.nivel_alerta]}</span>${esc(p.logradouro)}</h3>
      <div class="meta">${esc(p.distrito)} · ${esc(p.subprefeitura)} · chuva 24 h: ${p.chuva_prevista_24h_mm ?? "–"} mm</div>
      <div class="rec">${esc(p.recomendacao)}</div>
    </li>`).join("") || "<li>Nenhum ponto encontrado.</li>";
  ul.querySelectorAll("li[data-id]").forEach(li => {
    const abrir = () => { const m = marcadores[li.dataset.id]; mapa.setView(m.getLatLng(), 16); m.openPopup(); };
    li.addEventListener("click", abrir);
    li.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(); } });
  });
}

fetch(`${API}/mapa`)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    pontos = d.pontos.sort((a, b) => ORDEM[a.nivel_alerta] - ORDEM[b.nivel_alerta] || b.score_prioridade - a.score_prioridade);
    const conta = n => pontos.filter(p => p.nivel_alerta === n).length;
    document.getElementById("n-evite").textContent = conta("EVITE A AREA");
    document.getElementById("n-atencao").textContent = conta("ATENCAO");
    document.getElementById("n-normal").textContent = conta("NORMAL");
    const chuvas = pontos.map(p => p.chuva_prevista_24h_mm).filter(v => v != null);
    const max = chuvas.length ? Math.max(...chuvas) : null;
    document.getElementById("chuva").innerHTML = max == null ? "Previsão indisponível no momento." :
      `🌧️ Chuva prevista nas próximas 24 h: até <b>${max} mm</b> na cidade. Alerta a partir de ${d.limiar_chuva_mm} mm.`;
    for (const p of pontos.slice().reverse()) {
      marcadores[p.id_bueiro] = L.circleMarker([p.latitude, p.longitude], {
        radius: p.nivel_alerta === "EVITE A AREA" ? 9 : 6, color: "#fff", weight: 1.5,
        fillColor: COR[p.nivel_alerta], fillOpacity: .95
      }).bindPopup(popup(p)).addTo(camadaCidadao);
    }
    const dt = pontos[0]?.data_ultima_inspecao ?? "";
    document.getElementById("rodape").innerHTML =
      `Última inspeção: ${esc(dt.split("-").reverse().join("/"))} · ${pontos.length} bocas de lobo.<br>
       Fontes: inspeções do robô, previsão Open-Meteo, pluviômetros Cemaden, áreas de risco GeoSampa e pedidos SP156.<br>
       Dados: <code>${esc(d.fonte)}</code>. Nenhum dado pessoal é exibido.<br>
       Emergência: Defesa Civil <b>199</b> · Bombeiros <b>193</b>.`;
    render();
  })
  .catch(() => { document.getElementById("chuva").textContent = "Não foi possível carregar os dados agora. Tente de novo em instantes."; });

// ----------------------- Limpeza priorizada pelo bot de RPA (GET /api/v1/rpa) -----------------------
const COR_P = { CRITICA: "#b42318", ALTA: "#ea580c", MEDIA: "#e8a317" };
const ROTULO_P = { CRITICA: "Crítica", ALTA: "Alta", MEDIA: "Média" };
const ROTULO_NIVEL = { ALERTA: "Alerta", ATENCAO: "Atenção", NORMAL: "Normal" };
const ROTULO_STATUS = {
  CONCLUIDO: "Concluída", CONCLUIDO_COM_PENDENCIAS: "Concluída com pendências", SEM_ACAO: "Sem ação: chuva abaixo do limite",
  FALHA_PREVISAO: "Falhou: previsão indisponível", FALHA_DADOS: "Falhou: sem inspeções válidas", FALHA: "Falhou"
};
const num = (v, casas = 0) => v == null ? "–" : Number(v).toLocaleString("pt-BR", { maximumFractionDigits: casas });
const quando = iso => iso ? new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "–";
const fonte = f => !f ? "–" : f.startsWith("open-meteo") ? "Open-Meteo" : f.startsWith("cache") ? `cache ${f.slice(5).trim()}` : f === "simulacao" ? "simulação" : f;

let ordens = [], marcadoresRpa = {}, filtroP = "TODAS", rpaCarregado = false, rpaEnquadrado = false;

function popupOrdem(o) {
  return `<strong>${esc(o.id_bueiro)} · ${esc(o.endereco)}</strong><br>${esc(o.area)}<br>
    <span class="selo ${esc(o.prioridade)}">${ROTULO_P[o.prioridade] || esc(o.prioridade)}</span>nota ${num(o.score)} de 100<br>
    Obstrução ${num(o.nivel_obstrucao)}% · ${esc(o.tipo_residuo)}<br>
    ${o.status === "AGUARDANDO_REFORCO" ? "<b>Aguardando reforço</b> (equipes sem capacidade)" : `Equipe ${esc(o.equipe_id)} · aberta`}
    ${o.reinspecionar ? "<br><em>Precisa de nova inspeção do robô</em>" : ""}`;
}

function renderRpa() {
  const vis = ordens.filter(o => filtroP === "TODAS" || o.prioridade === filtroP);
  const ids = new Set(vis.map(o => o.id_bueiro));
  for (const [id, m] of Object.entries(marcadoresRpa)) {
    if (ids.has(id)) { if (!camadaRpa.hasLayer(m)) camadaRpa.addLayer(m); } else camadaRpa.removeLayer(m);
  }
  const ul = document.getElementById("rpa-lista");
  ul.innerHTML = vis.map(o => `
    <li class="${esc(o.prioridade)}" tabindex="0" data-id="${esc(o.id_bueiro)}">
      <h3><span class="selo ${esc(o.prioridade)}">${ROTULO_P[o.prioridade] || esc(o.prioridade)}</span>${num(o.ordem)}. ${esc(o.endereco)}</h3>
      <div class="meta">${esc(o.id_bueiro)} · ${esc(o.area)} · ${num(o.nivel_obstrucao)}% obstruído · ${esc(o.tipo_residuo)} · nota ${num(o.score)}</div>
      ${o.status === "AGUARDANDO_REFORCO" ? '<span class="tag reforco">Aguardando reforço</span>' : `<span class="tag">Equipe ${esc(o.equipe_id)}</span>`}
      ${o.reinspecionar ? '<span class="tag reinsp">Reinspecionar</span>' : ""}
    </li>`).join("") || (ordens.length ? "<li>Nenhuma ordem com essa prioridade.</li>" : "");
  ul.querySelectorAll("li[data-id]").forEach(li => {
    const abrir = () => { const m = marcadoresRpa[li.dataset.id]; mapa.setView(m.getLatLng(), 17); m.openPopup(); };
    li.addEventListener("click", abrir);
    li.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(); } });
  });
}

function mostrarRpa(d) {
  const ex = d.execucao || {};
  ordens = (d.ordens_servico || []).slice().sort((a, b) => (a.ordem ?? 1e9) - (b.ordem ?? 1e9));
  const reforco = ordens.filter(o => o.status === "AGUARDANDO_REFORCO").length;
  const nivel = ex.nivel ? `<span class="nivel ${esc(ex.nivel)}">Chuva: ${ROTULO_NIVEL[ex.nivel] || esc(ex.nivel)}</span>`
                         : '<span class="nivel SEM">Sem nível</span>';
  document.getElementById("rpa-conteudo").innerHTML = `
    <div class="execucao">
      <div class="topo">${nivel}<span class="suave">${quando(ex.inicio)}</span></div>
      🌧️ <b>${num(ex.chuva_24h_mm, 1)} mm</b> previstos em 24 h · pico ${num(ex.pico_mm_h, 1)} mm/h · ${num(ex.probabilidade_max_pct)}% de chance<br>
      <span class="suave">Previsão: ${esc(fonte(ex.fonte_previsao))} · Execução: ${esc(ROTULO_STATUS[ex.status] || ex.status)}</span>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${ordens.length}</b><span>bocas de lobo para limpar</span></div>
      <div class="kpi"><b>${reforco}</b><span>aguardando reforço</span></div>
      <div class="kpi"><b>${num(ex.alertas_enviados)}</b><span>alertas enviados</span></div>
    </div>
    <div class="inspecoes">Inspeções do robô: ${num(ex.linhas_lidas)} lidas · ${num(ex.inspecoes_validas)} válidas ·
      ${num(ex.rejeitados)} rejeitadas · ${num(ex.duplicados)} duplicadas</div>
    ${ordens.length ? "" : `<div class="aviso">Nenhuma boca de lobo precisa de limpeza nesta execução.</div>`}`;
  document.getElementById("rpa-filtros").hidden = !ordens.length;
  camadaRpa.clearLayers(); marcadoresRpa = {};
  for (const o of ordens.slice().reverse()) {
    marcadoresRpa[o.id_bueiro] = L.circleMarker([o.lat, o.lon], {
      radius: o.prioridade === "CRITICA" ? 9 : 7, fillColor: COR_P[o.prioridade] || "#5a6375", fillOpacity: .95,
      color: o.status === "AGUARDANDO_REFORCO" ? "#1a1f2b" : "#fff", weight: o.status === "AGUARDANDO_REFORCO" ? 2.5 : 1.5
    }).bindPopup(popupOrdem(o)).addTo(camadaRpa);
  }
  document.getElementById("rpa-rodape").innerHTML =
    `Lista gerada pelo bot de RPA (execução <code>${esc(ex.id)}</code>), da mais urgente para a menos urgente.<br>
     Nota de 0 a 100 = obstrução + risco da área + histórico de alagamentos.`;
  rpaCarregado = true;
  renderRpa();
}

fetch(`${API}/rpa`)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(mostrarRpa)
  .catch(() => {
    document.getElementById("rpa-conteudo").innerHTML =
      '<div class="aviso">A lista de limpeza do bot de RPA não está disponível agora. O mapa “Onde não passar” segue funcionando.</div>';
  });

function trocarAba(rpa) {
  const [ativa, inativa] = rpa ? ["rpa", "cidadao"] : ["cidadao", "rpa"];
  document.getElementById(`aba-${ativa}`).setAttribute("aria-selected", "true");
  document.getElementById(`aba-${ativa}`).tabIndex = 0;
  document.getElementById(`aba-${inativa}`).setAttribute("aria-selected", "false");
  document.getElementById(`aba-${inativa}`).tabIndex = -1;
  document.getElementById(`painel-${ativa}`).hidden = false;
  document.getElementById(`painel-${inativa}`).hidden = true;
  mapa.closePopup();
  if (rpa) {
    mapa.removeLayer(camadaCidadao); camadaRpa.addTo(mapa);
    desenharLegenda(COR_P, ROTULO_P, '<br><i style="background:#fff;border:2.5px solid #1a1f2b"></i>Aguardando reforço');
    if (rpaCarregado && ordens.length && !rpaEnquadrado) {
      mapa.fitBounds(L.latLngBounds(ordens.map(o => [o.lat, o.lon])).pad(0.25)); rpaEnquadrado = true;
    }
  } else {
    mapa.removeLayer(camadaRpa); camadaCidadao.addTo(mapa);
    desenharLegenda(COR, ROTULO);
  }
}
document.getElementById("aba-cidadao").addEventListener("click", () => trocarAba(false));
document.getElementById("aba-rpa").addEventListener("click", () => trocarAba(true));
document.querySelector(".abas").addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const irRpa = document.getElementById("aba-cidadao").getAttribute("aria-selected") === "true";
  trocarAba(irRpa); document.getElementById(irRpa ? "aba-rpa" : "aba-cidadao").focus();
});
document.querySelectorAll("#rpa-filtros button").forEach(b => b.addEventListener("click", () => {
  filtroP = b.dataset.p;
  document.querySelectorAll("#rpa-filtros button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  renderRpa();
}));

document.getElementById("busca").addEventListener("input", render);
document.querySelectorAll("#painel-cidadao .filtros button").forEach(b => b.addEventListener("click", () => {
  filtro = b.dataset.f;
  document.querySelectorAll("#painel-cidadao .filtros button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));
</script>
