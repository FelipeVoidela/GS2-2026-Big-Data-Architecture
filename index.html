<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boca de Lobo · Onde não passar hoje</title>
<meta name="description" content="Mapa público de bocas de lobo entupidas em áreas de risco de alagamento, com a chuva prevista para as próximas 24 horas.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --texto: #1a1f2b; --suave: #5a6375; --borda: #dde1e8;
    --evite: #b42318; --evite-bg: #fee4e2; --atencao: #8a5a00; --atencao-ponto: #e8a317; --atencao-bg: #fff4d6;
    --normal: #1e6b3a; --normal-ponto: #2f9e5b; --normal-bg: #e3f4ea; --foco: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--texto); }
  header { background: #0f2a4a; color: #fff; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
  header h1 { margin: 0; font-size: 1.35rem; }
  header p { margin: 0; color: #c9d6ea; font-size: .95rem; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 0; height: calc(100vh - 56px); }
  aside { overflow-y: auto; padding: 16px; border-right: 1px solid var(--borda); background: var(--card); }
  #mapa { height: 100%; }
  .resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .chip { border-radius: 10px; padding: 10px; text-align: center; }
  .chip b { display: block; font-size: 1.6rem; line-height: 1.1; }
  .chip span { font-size: .8rem; font-weight: 600; }
  .chip.evite { background: var(--evite-bg); color: var(--evite); }
  .chip.atencao { background: var(--atencao-bg); color: var(--atencao); }
  .chip.normal { background: var(--normal-bg); color: var(--normal); }
  .chuva { background: #eaf1fb; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: .92rem; }
  label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: 4px; }
  input[type=search] { width: 100%; padding: 10px 12px; font-size: 1rem; border: 1px solid var(--borda); border-radius: 8px; }
  input:focus-visible, button:focus-visible, li:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
  .filtros { display: flex; gap: 6px; margin: 10px 0 12px; flex-wrap: wrap; }
  .filtros button { border: 1px solid var(--borda); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .85rem; }
  .filtros button[aria-pressed=true] { background: #0f2a4a; color: #fff; border-color: #0f2a4a; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border: 1px solid var(--borda); border-left-width: 6px; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; background: #fff; }
  li.EVITE { border-left-color: var(--evite); } li.ATENCAO { border-left-color: var(--atencao-ponto); } li.NORMAL { border-left-color: var(--normal-ponto); }
  li h3 { margin: 0 0 2px; font-size: .98rem; }
  li .meta { color: var(--suave); font-size: .82rem; }
  li .rec { font-size: .88rem; margin-top: 4px; }
  .selo { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
  .selo.EVITE { background: var(--evite-bg); color: var(--evite); } .selo.ATENCAO { background: var(--atencao-bg); color: var(--atencao); } .selo.NORMAL { background: var(--normal-bg); color: var(--normal); }
  footer { font-size: .78rem; color: var(--suave); margin-top: 12px; line-height: 1.45; }
  .legenda { background: #fff; padding: 8px 10px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.2); font-size: .82rem; line-height: 1.7; }
  .legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    #mapa { height: 55vh; order: -1; }
    aside { border-right: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Boca de Lobo</h1>
  <p>Onde não passar hoje: bueiros entupidos em áreas que alagam, com a chuva prevista para as próximas 24 horas.</p>
</header>
<main>
  <aside aria-label="Resumo e lista de pontos">
    <div class="resumo" aria-live="polite">
      <div class="chip evite"><b id="n-evite">–</b><span>Evite a área</span></div>
      <div class="chip atencao"><b id="n-atencao">–</b><span>Atenção</span></div>
      <div class="chip normal"><b id="n-normal">–</b><span>Normal</span></div>
    </div>
    <div class="chuva" id="chuva">Carregando previsão…</div>
    <label for="busca">Procure sua rua, bairro ou subprefeitura</label>
    <input id="busca" type="search" placeholder="Ex.: Itaim Paulista, Rua Jordânia" autocomplete="off">
    <div class="filtros" role="group" aria-label="Filtrar por nível de alerta">
      <button data-f="TODOS" aria-pressed="true">Todos</button>
      <button data-f="EVITE A AREA" aria-pressed="false">Evite a área</button>
      <button data-f="ATENCAO" aria-pressed="false">Atenção</button>
      <button data-f="NORMAL" aria-pressed="false">Normal</button>
    </div>
    <ul id="lista" aria-label="Bocas de lobo"></ul>
    <footer id="rodape"></footer>
  </aside>
  <div id="mapa" role="region" aria-label="Mapa das bocas de lobo"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COR = { "EVITE A AREA": "#b42318", "ATENCAO": "#e8a317", "NORMAL": "#2f9e5b" };
const ROTULO = { "EVITE A AREA": "Evite a área", "ATENCAO": "Atenção", "NORMAL": "Normal" };
const CLASSE = { "EVITE A AREA": "EVITE", "ATENCAO": "ATENCAO", "NORMAL": "NORMAL" };
const ORDEM = { "EVITE A AREA": 0, "ATENCAO": 1, "NORMAL": 2 };
const RISCO = { dentro: "dentro de área de risco", vizinho: "ao lado de área de risco", fora: "fora de área de risco mapeada" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const mapa = L.map("mapa", { zoomControl: true }).setView([-23.62, -46.6], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap"
}).addTo(mapa);
const legenda = L.control({ position: "bottomright" });
legenda.onAdd = () => {
  const d = L.DomUtil.create("div", "legenda");
  d.innerHTML = Object.keys(COR).map(k => `<i style="background:${COR[k]}"></i>${ROTULO[k]}`).join("<br>");
  return d;
};
legenda.addTo(mapa);

let pontos = [], marcadores = {}, filtro = "TODOS";

function popup(p) {
  return `<strong>${esc(p.logradouro)}</strong><br>${esc(p.distrito)} · ${esc(p.subprefeitura)}<br>
    <span class="selo ${CLASSE[p.nivel_alerta]}">${ROTULO[p.nivel_alerta]}</span>
    Obstrução ${p.obstrucao_pct ?? "–"}%<br>
    Chuva prevista (24 h): <b>${p.chuva_prevista_24h_mm ?? "–"} mm</b><br>
    ${RISCO[p.situacao_risco] || ""}${p.grau_risco ? " (" + esc(p.grau_risco) + ")" : ""}<br>
    <em>${esc(p.recomendacao)}</em>`;
}

function render() {
  const q = document.getElementById("busca").value.trim().toLowerCase();
  const vis = pontos.filter(p =>
    (filtro === "TODOS" || p.nivel_alerta === filtro) &&
    (!q || `${p.logradouro} ${p.distrito} ${p.subprefeitura}`.toLowerCase().includes(q)));
  const ids = new Set(vis.map(p => p.id_bueiro));
  for (const [id, m] of Object.entries(marcadores)) {
    if (ids.has(id)) { if (!mapa.hasLayer(m)) m.addTo(mapa); } else mapa.removeLayer(m);
  }
  const ul = document.getElementById("lista");
  ul.innerHTML = vis.slice(0, 150).map(p => `
    <li class="${CLASSE[p.nivel_alerta]}" tabindex="0" data-id="${esc(p.id_bueiro)}">
      <h3><span class="selo ${CLASSE[p.nivel_alerta]}">${ROTULO[p.nivel_alerta]}</span>${esc(p.logradouro)}</h3>
      <div class="meta">${esc(p.distrito)} · ${esc(p.subprefeitura)} · chuva 24 h: ${p.chuva_prevista_24h_mm ?? "–"} mm</div>
      <div class="rec">${esc(p.recomendacao)}</div>
    </li>`).join("") || "<li>Nenhum ponto encontrado.</li>";
  ul.querySelectorAll("li[data-id]").forEach(li => {
    const abrir = () => { const m = marcadores[li.dataset.id]; mapa.setView(m.getLatLng(), 16); m.openPopup(); };
    li.addEventListener("click", abrir);
    li.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(); } });
  });
}

fetch("dados/mapa_cidadao.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    pontos = d.pontos.sort((a, b) => ORDEM[a.nivel_alerta] - ORDEM[b.nivel_alerta] || b.score_prioridade - a.score_prioridade);
    const conta = n => pontos.filter(p => p.nivel_alerta === n).length;
    document.getElementById("n-evite").textContent = conta("EVITE A AREA");
    document.getElementById("n-atencao").textContent = conta("ATENCAO");
    document.getElementById("n-normal").textContent = conta("NORMAL");
    const chuvas = pontos.map(p => p.chuva_prevista_24h_mm).filter(v => v != null);
    const max = chuvas.length ? Math.max(...chuvas) : null;
    document.getElementById("chuva").innerHTML = max == null ? "Previsão indisponível no momento." :
      `🌧️ Chuva prevista nas próximas 24 h: até <b>${max} mm</b> na cidade. Alerta a partir de ${d.limiar_chuva_mm} mm.`;
    for (const p of pontos.slice().reverse()) {
      marcadores[p.id_bueiro] = L.circleMarker([p.latitude, p.longitude], {
        radius: p.nivel_alerta === "EVITE A AREA" ? 9 : 6, color: "#fff", weight: 1.5,
        fillColor: COR[p.nivel_alerta], fillOpacity: .95
      }).bindPopup(popup(p)).addTo(mapa);
    }
    const dt = pontos[0]?.data_ultima_inspecao ?? "";
    document.getElementById("rodape").innerHTML =
      `Última inspeção: ${esc(dt.split("-").reverse().join("/"))} · ${pontos.length} bocas de lobo.<br>
       Fontes: inspeções do robô, previsão Open-Meteo, pluviômetros Cemaden, áreas de risco GeoSampa e pedidos SP156.<br>
       Dados: <code>${esc(d.fonte)}</code>. Nenhum dado pessoal é exibido.<br>
       Emergência: Defesa Civil <b>199</b> · Bombeiros <b>193</b>.`;
    render();
  })
  .catch(() => { document.getElementById("chuva").textContent = "Não foi possível carregar os dados agora. Tente de novo em instantes."; });

document.getElementById("busca").addEventListener("input", render);
document.querySelectorAll(".filtros button").forEach(b => b.addEventListener("click", () => {
  filtro = b.dataset.f;
  document.querySelectorAll(".filtros button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));
</script>
</body>
</html>
